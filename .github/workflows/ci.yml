name: Shell checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run offline smoke tests
        run: bash tests/test-setup.sh
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh tests/*.sh
      - name: Validate JSON starter files
        run: python3 -m json.tool dotfiles/dot_config/macbook-dev-setup/vscode-settings.json >/dev/null
