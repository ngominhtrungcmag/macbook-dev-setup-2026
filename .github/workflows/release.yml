name: Release to Homebrew
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build versioned archive and formula
        run: bash scripts/package-homebrew.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/dist"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dist="$RUNNER_TEMP/dist"
          archive="macbook-dev-setup-$GITHUB_REF_NAME.tar.gz"
          formula=macbook-dev-setup.rb
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
          fi
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == true ]]; then
            gh release upload "$GITHUB_REF_NAME" "$dist/$archive" "$dist/$formula" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release download "$GITHUB_REF_NAME" --pattern "$archive" --pattern "$formula" --dir "$RUNNER_TEMP/published"
            cmp "$dist/$archive" "$RUNNER_TEMP/published/$archive"
            cmp "$dist/$formula" "$RUNNER_TEMP/published/$formula"
          fi
      - name: Update the public tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh auth setup-git
          gh repo clone ngominhtrungcmag/homebrew-macbook-dev-setup "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          file=Formula/macbook-dev-setup.rb
          mkdir -p Formula
          if [[ -f "$file" ]]; then
            current="$(sed -n 's/^  version "\([^"]*\)"$/\1/p' "$file")"
            latest="$(printf '%s\n' "$current" "${GITHUB_REF_NAME#v}" | sort -V | tail -n 1)"
            if [[ "$latest" != "${GITHUB_REF_NAME#v}" ]]; then
              exit 0
            fi
          fi
          cp "$RUNNER_TEMP/dist/macbook-dev-setup.rb" "$file"
          git add "$file"
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Release macbook-dev-setup $GITHUB_REF_NAME"
          git push
